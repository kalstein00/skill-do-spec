[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "do-spec"
version = "0.2.0"
description = "Guarded local ticket execution using Dagu"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
do-spec = "do_spec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
